name: refresh

# WHY THIS EXISTS
# The desk used to refresh only when the Mac happened to be awake, so a machine asleep at 06:30
# meant no fantasy squad, no Kalshi settlement and a stale dashboard until the next day. GitHub
# runs this on its own schedule whether or not any of your machines are on, and publishes the
# result to a URL that is always up.

on:
  schedule:
    # Times are UTC. Kick-offs run 11:00-20:00 UTC and 265 of 380 fixtures are on a Saturday.
    - cron: '30 5 * * *'          # every day, early - picks up overnight price + injury changes
    - cron: '0 10,13,16,19 * * 6' # Saturday, around the kick-off slots
    - cron: '0 12,15,18 * * 0'    # Sunday
    - cron: '0 18 * * 3'          # Wednesday midweek round
  workflow_dispatch:              # and a manual "Run workflow" button

# Never let two runs overwrite each other's ledger commits.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write        # to commit the updated ledgers and outputs back
  pages: write           # to publish the dashboard
  id-token: write
  actions: write         # to clear a stale Pages artifact left by a previous attempt

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The runner's default locale is ASCII, so any non-ASCII character in a print()
    # raises UnicodeEncodeError and kills the step. Run #1 died exactly this way: the
    # transfer verdict contained a right-arrow. The arrow is now ASCII, but forcing
    # UTF-8 here means the next stray character does not take the build down.
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # Get any commits made since this run started BEFORE building. The ledgers are keyed
      # append-style files that the build reads, updates and rewrites - so if it builds on a
      # stale copy, the push afterwards collides and git cannot auto-merge a CSV. Pulling
      # first means the build starts from the newest ledgers and the push is a fast-forward.
      - name: Sync before building
        run: |
          git config user.name  "prem-predictor-bot"
          git config user.email "actions@github.com"
          git pull --ff-only origin main || git pull --rebase --autostash origin main

      # The API response cache. Without it every run refetches per-match stats from scratch,
      # which is what turned some local runs into 90-minute jobs.
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: dashboard/.cache
          key: apicache-${{ github.run_id }}
          restore-keys: apicache-

      - name: Your FPL team id
        run: |
          mkdir -p dashboard
          echo '{"entry_id": ${{ secrets.FPL_ENTRY_ID || 0 }}}' > dashboard/fpl_config.json

      # Each step is its own block so a failure is visible in the Actions UI by name, and
      # `continue-on-error` keeps one dead feed from costing the whole run - exactly the
      # cascade that took out four of eight steps on 2026-09-11.
      - name: Player stats
        run: python dashboard/build_player_stats.py
        continue-on-error: true
      - name: Team stats
        run: python dashboard/team_stats.py
        continue-on-error: true
      - name: FotMob + xG strength index
        run: python dashboard/fotmob.py
        continue-on-error: true
      - name: Rankings
        run: python build_rankings.py
        continue-on-error: true
      - name: Link squads
        run: python link_squads.py
        continue-on-error: true
      - name: Strength
        run: python compute_strength.py
        continue-on-error: true

      # This one is NOT continue-on-error: it writes the ledgers and the dashboard. If it
      # fails the run should fail, loudly.
      - name: Build dashboard
        run: python dashboard/build_dashboard.py

      - name: Render standalone page
        run: python dashboard/make_standalone.py

      # The ledgers are the whole point of the project - they must survive between runs, and
      # Actions runners are wiped every time.
      - name: Commit the evidence log
        run: |
          set -e
          git add -A outputs dashboard/*.csv dashboard/refresh_status.json .state || true
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          if git push; then exit 0; fi

          # Someone pushed while we were building. A CSV cannot be auto-merged, and picking a
          # side would silently drop whichever ledger rows lost - these files ARE the evidence
          # log, so that is the one thing not to do. Instead: take the newest ledgers, then
          # re-run the build so this run's rows are re-applied on top of them. The build is
          # idempotent and keyed, so replaying it is exactly the right merge.
          echo "push rejected - rebuilding on top of the newest ledgers"
          git reset --hard HEAD~1
          git fetch origin main
          git reset --hard origin/main
          python dashboard/build_dashboard.py
          python dashboard/make_standalone.py
          git add -A outputs dashboard/*.csv dashboard/refresh_status.json .state || true
          git diff --cached --quiet || git commit -q -m "refresh $(date -u '+%Y-%m-%d %H:%M UTC') (rebuilt after race)"
          git push

      - name: Package the dashboard for Pages
        run: |
          mkdir -p _site
          cp dashboard/standalone.html _site/index.html
      # Re-running a failed JOB keeps the previous attempt's artifact, so deploy-pages then
      # finds two named "github-pages" and refuses with "Artifact count is 2". Clear the old
      # one first so a re-run behaves like a fresh run. Only runs on attempt 2+.
      - name: Clear a stale Pages artifact from an earlier attempt
        if: ${{ github.run_attempt != '1' }}
        run: |
          ids=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            | python3 -c "import json,sys; print(' '.join(str(a['id']) for a in json.load(sys.stdin).get('artifacts',[]) if a['name']=='github-pages'))")
          for id in $ids; do
            echo "removing stale github-pages artifact $id"
            curl -sS -X DELETE -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$id" || true
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
